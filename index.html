<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebAR: Bắn Quái Vật Bằng Ngón Tay</title>
    
    <!-- Import Three.js cho 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Import MediaPipe Hands cho Computer Vision -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }
        
        /* Camera thực tế ở dưới cùng */
        #video-background {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        /* Canvas 3D đè lên trên camera */
        #ar-canvas {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 2;
            pointer-events: none; /* Xuyên thao tác chạm xuống UI */
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none; /* Chỉ click được vào các nút */
        }

        .hud-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            pointer-events: auto;
        }

        #score-board {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 25px;
            border-radius: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #cam-toggle-btn {
            background: rgba(0, 122, 255, 0.8);
            backdrop-filter: blur(5px);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        #cam-toggle-btn:active { transform: scale(0.95); }

        /* Màn hình Loading */
        #loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: opacity 0.5s ease-out;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(255,255,255,0.2);
            border-top: 5px solid #007aff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Màn hình Loading khởi tạo AI -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <h2 id="loading-text">Đang tải mô hình AI & AR...</h2>
        <p>Vui lòng cho phép quyền truy cập Camera</p>
    </div>

    <!-- Video luồng Camera -->
    <video id="video-background" autoplay playsinline></video>
    
    <!-- Canvas Three.js -->
    <canvas id="ar-canvas"></canvas>

    <!-- Giao diện UI -->
    <div id="ui-layer">
        <div class="hud-container">
            <div id="score-board">Điểm: <span id="score-value">0</span></div>
            <button id="cam-toggle-btn">🔄 Đổi Camera</button>
        </div>
    </div>

<script>
    /* ==========================================
       PHẦN 1: CẤU HÌNH BIẾN TOÀN CỤC & THREE.JS
       ========================================== */
    let score = 0;
    let cameraMode = 'environment'; // 'environment' = cam sau, 'user' = cam trước
    let isFlipped = false;
    let videoStream = null;
    let handTrackingRunning = false;

    // DOM Elements
    const videoElement = document.getElementById('video-background');
    const canvasElement = document.getElementById('ar-canvas');
    const scoreElement = document.getElementById('score-value');
    const loadingScreen = document.getElementById('loading-screen');
    const camToggleBtn = document.getElementById('cam-toggle-btn');

    // Cài đặt không gian Three.js
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 5); // Camera ở vị trí người nhìn (cao 1.5m)

    const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Ánh sáng cho nhân vật 3D đẹp hơn
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    // Hệ thống toạ độ 3D: Mặt đất giả lập (ẩn) để neo nhân vật
    const groundZ = -3; // Độ sâu mặt đất
    
    /* ==========================================
       PHẦN 2: HỆ THỐNG SPAWN NHÂN VẬT & HIỆU ỨNG
       ========================================== */
    const enemies = [];
    const particles = [];
    const MAX_ENEMIES = 20;

    // Hàm tạo một nhân vật Cute 3D (Cấu trúc con lật đật / người tuyết)
    function createCuteCharacter() {
        const group = new THREE.Group();
        const colors = [0xff3b30, 0xff9500, 0xffcc00, 0x4cd964, 0x5ac8fa, 0x007aff, 0x5856d6, 0xff2d55];
        const color = colors[Math.floor(Math.random() * colors.length)];
        const material = new THREE.MeshPhongMaterial({ color: color, shininess: 80 });

        // Thân
        const bodyGeo = new THREE.SphereGeometry(0.3, 16, 16);
        const body = new THREE.Mesh(bodyGeo, material);
        body.position.y = 0.3;
        group.add(body);

        // Đầu
        const headGeo = new THREE.SphereGeometry(0.2, 16, 16);
        const head = new THREE.Mesh(headGeo, material);
        head.position.y = 0.7;
        group.add(head);

        // Mắt (Màu đen)
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const eyeGeo = new THREE.SphereGeometry(0.04, 8, 8);
        const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
        eyeL.position.set(-0.08, 0.75, 0.17);
        const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
        eyeR.position.set(0.08, 0.75, 0.17);
        group.add(eyeL);
        group.add(eyeR);

        // Đặt vị trí ngẫu nhiên trên "mặt đất"
        group.position.set((Math.random() - 0.5) * 6, -1, groundZ - Math.random() * 4);
        
        // Lưu dữ liệu để Hit-test (Gắn hitbox)
        group.hitRadius = 0.5;
        group.color = color;
        
        return group;
    }

    // Logic Sinh sản liên tục
    setInterval(() => {
        if (enemies.length < MAX_ENEMIES && handTrackingRunning) {
            const enemy = createCuteCharacter();
            scene.add(enemy);
            enemies.push(enemy);
        }
    }, 1000);

    // Hiệu ứng hạt nổ (Particle Explosion)
    function createExplosion(position, color) {
        const particleCount = 25;
        const particleGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
        const particleMat = new THREE.MeshBasicMaterial({ color: color });

        for (let i = 0; i < particleCount; i++) {
            const p = new THREE.Mesh(particleGeo, particleMat);
            p.position.copy(position);
            // Vận tốc văng ngẫu nhiên
            p.velocity = new THREE.Vector3(
                (Math.random() - 0.5) * 0.2,
                (Math.random() - 0.5) * 0.2,
                (Math.random() - 0.5) * 0.2
            );
            p.life = 1.0; // Thời gian sống
            scene.add(p);
            particles.push(p);
        }
    }

    /* ==========================================
       PHẦN 3: ĐÁNH DẤU FINGER CURSOR & TƯƠNG TÁC
       ========================================== */
    
    // Con trỏ laser (Cursor) đại diện cho đầu ngón tay trong 3D
    const cursorGeo = new THREE.SphereGeometry(0.1, 16, 16);
    const cursorMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
    const cursor = new THREE.Mesh(cursorGeo, cursorMat);
    scene.add(cursor);

    const raycaster = new THREE.Raycaster();
    const finger2D = new THREE.Vector2(-2, -2); // Chặn ở ngoài màn hình khi chưa nhận diện

    /* ==========================================
       PHẦN 4: MEDIAPIPE HAND TRACKING & CAMERA
       ========================================== */
    const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1, // 0 nhẹ nhàng, 1 chuẩn xác
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
        handTrackingRunning = true;
        // Ẩn màn hình loading khi AI đã chạy
        if(loadingScreen.style.opacity !== '0') {
            loadingScreen.style.opacity = '0';
            setTimeout(() => loadingScreen.style.display = 'none', 500);
        }

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            // Lấy điểm số 8: Đầu ngón trỏ (Index Finger Tip)
            const indexTip = results.multiHandLandmarks[0][8];
            
            // Xử lý lật tọa độ nếu dùng cam trước (hiệu ứng gương)
            let xPos = indexTip.x;
            if (isFlipped) xPos = 1 - xPos;

            // Chuyển đổi tọa độ 2D của ngón tay (0 -> 1) sang chuẩn NDC của Three.js (-1 -> 1)
            finger2D.x = (xPos * 2) - 1;
            finger2D.y = -(indexTip.y * 2) + 1;
            
            // Hiện con trỏ
            cursor.visible = true;
        } else {
            // Giấu con trỏ nếu không thấy tay
            finger2D.set(-2, -2);
            cursor.visible = false;
        }
    });

    // Quản lý luồng Camera
    async function setupCamera() {
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
        }
        
        isFlipped = (cameraMode === 'user');
        // Lật CSS của video để tạo cảm giác soi gương nếu là cam trước
        videoElement.style.transform = isFlipped ? 'scaleX(-1)' : 'scaleX(1)';

        const constraints = {
            video: { facingMode: cameraMode, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        };

        try {
            videoStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoElement.srcObject = videoStream;
            await new Promise(resolve => { videoElement.onloadedmetadata = () => resolve(); });
            videoElement.play();
            processVideoFrame(); // Bắt đầu gửi frame vào AI
        } catch (error) {
            alert("Không thể truy cập Camera. Vui lòng cấp quyền trong cài đặt trình duyệt!");
            document.getElementById('loading-text').innerText = "Lỗi Camera!";
        }
    }

    // Đẩy frame video vào MediaPipe liên tục
    let lastVideoTime = -1;
    async function processVideoFrame() {
        if (!videoElement.paused && videoElement.currentTime !== lastVideoTime) {
            lastVideoTime = videoElement.currentTime;
            await hands.send({ image: videoElement });
        }
        requestAnimationFrame(processVideoFrame);
    }

    // Nút chuyển đổi Camera
    camToggleBtn.addEventListener('click', () => {
        cameraMode = cameraMode === 'environment' ? 'user' : 'environment';
        setupCamera();
    });

    /* ==========================================
       PHẦN 5: RENDER LOOP & LOGIC GAME
       ========================================== */
    function animate() {
        requestAnimationFrame(animate);

        // 1. Cập nhật vị trí con trỏ Laser trong không gian 3D
        raycaster.setFromCamera(finger2D, camera);
        // Đặt con trỏ cách camera 4 unit dọc theo tia ngón tay chỉ vào
        cursor.position.copy(camera.position).add(raycaster.ray.direction.multiplyScalar(4));

        // 2. Kiểm tra va chạm (Hit-test: Ngón tay đâm trúng nhân vật)
        for (let i = enemies.length - 1; i >= 0; i--) {
            const enemy = enemies[i];
            enemy.rotation.y += 0.02; // Cho nhân vật xoay nhẹ nhàng

            // Tính khoảng cách từ con trỏ ngón tay 3D đến trung tâm nhân vật
            const distance = cursor.position.distanceTo(enemy.position);
            
            // Kích hoạt NỔ
            if (distance < enemy.hitRadius) {
                // Tạo hạt nổ
                createExplosion(enemy.position, enemy.color);
                
                // Xoá nhân vật
                scene.remove(enemy);
                enemies.splice(i, 1);
                
                // Cộng điểm
                score++;
                scoreElement.innerText = score;
            }
        }

        // 3. Cập nhật hiệu ứng hạt nổ (Animation)
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.position.add(p.velocity); // Di chuyển
            p.rotation.x += 0.1;
            p.rotation.y += 0.1;
            p.material.opacity = p.life;
            p.material.transparent = true;
            p.scale.multiplyScalar(0.95); // Thu nhỏ dần
            p.life -= 0.03; // Giảm tuổi thọ

            if (p.life <= 0) {
                scene.remove(p);
                p.material.dispose();
                p.geometry.dispose();
                particles.splice(i, 1);
            }
        }

        // 4. Render Scene
        renderer.render(scene, camera);
    }

    // Xử lý khi xoay màn hình (Resize)
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Bắt đầu toàn bộ ứng dụng
    setupCamera();
    animate();

</script>
</body>
</html>
