<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Finger Shooter - Trí Như</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ar-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        video { display: none; } /* Ẩn video gốc, sẽ render video qua Three.js background */
        
        /* UI Overlay */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; /* Không chặn thao tác chạm */
        }
        #score-board {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px; border-radius: 15px;
            font-size: 24px; font-weight: bold; color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #cam-toggle {
            position: absolute; top: 20px; right: 20px;
            background: #ff4757; color: white;
            border: none; padding: 12px 20px; border-radius: 25px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            pointer-events: auto; /* Cho phép bấm */
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.3s;
        }
        #cam-toggle:active { background: #ff6b81; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7); color: #fff; padding: 20px; border-radius: 10px;
            font-size: 18px; text-align: center;
        }
    </style>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="videoElement" autoplay playsinline></video>
    <div id="ar-container"></div>
    
    <div id="ui-layer">
        <div id="score-board">Điểm: <span id="score">0</span></div>
        <button id="cam-toggle">Lật Camera</button>
        <div id="loading">Đang tải mô hình AI...<br><small>Vui lòng cho phép truy cập Camera</small></div>
    </div>

    <script>
        // --- 1. BIẾN TOÀN CỤC ---
        let scene, camera, renderer, videoTexture;
        let score = 0;
        let isFrontCam = false; // Mặc định camera sau
        let activeStream = null;
        
        // Quản lý Game
        const enemies = [];
        const particles = [];
        const MAX_ENEMIES = 20; // Giới hạn nhân vật
        let raycaster = new THREE.Raycaster();
        let pointer = new THREE.Vector2(-1, -1);
        
        // Cursor ngón tay
        let cursorMesh;

        // UI
        const scoreEl = document.getElementById('score');
        const loadingEl = document.getElementById('loading');
        const videoEl = document.getElementById('videoElement');
        const camToggleBtn = document.getElementById('cam-toggle');

        // --- 2. KHỞI TẠO THREE.JS ---
        function initThreeJS() {
            const container = document.getElementById('ar-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Ánh sáng
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(0, 10, 5);
            scene.add(dirLight);

            // Con trỏ ngón tay (Vòng tròn phát sáng)
            const cursorGeo = new THREE.RingGeometry(0.1, 0.15, 32);
            const cursorMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
            cursorMesh = new THREE.Mesh(cursorGeo, cursorMat);
            scene.add(cursorMesh);

            window.addEventListener('resize', onWindowResize, false);
            animate();
            spawnLoop();
        }

        // --- 3. QUẢN LÝ CAMERA ---
        async function startCamera() {
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
            }
            const constraints = {
                video: { facingMode: isFrontCam ? "user" : "environment", width: 640, height: 480 }
            };
            try {
                activeStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoEl.srcObject = activeStream;
                videoEl.play();

                // Gắn video làm background cho không gian 3D
                videoTexture = new THREE.VideoTexture(videoEl);
                videoTexture.minFilter = THREE.LinearFilter;
                videoTexture.magFilter = THREE.LinearFilter;
                videoTexture.format = THREE.RGBFormat;
                scene.background = videoTexture;

            } catch (err) {
                alert("Lỗi truy cập camera: " + err.message);
            }
        }

        camToggleBtn.addEventListener('click', () => {
            isFrontCam = !isFrontCam;
            startCamera();
        });

        // --- 4. TÍCH HỢP MEDIAPIPE (NHẬN DIỆN NGÓN TAY) ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1, // Dùng model nhẹ cho mobile
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });
        
        hands.onResults(onResults);

        // Đưa khung hình video vào MediaPipe
        const cameraUtils = new Camera(videoEl, {
            onFrame: async () => {
                await hands.send({image: videoEl});
            },
            width: 640,
            height: 480
        });

        function onResults(results) {
            if (loadingEl.style.display !== 'none') loadingEl.style.display = 'none';

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                // Landmark số 8 là đầu ngón trỏ (Index Finger Tip)
                const indexFingerTip = landmarks[8];

                // Chuyển đổi tọa độ [0,1] của MediaPipe sang NDC [-1,1] của Three.js
                // Lưu ý lật trục X nếu dùng camera trước (gương)
                let x = indexFingerTip.x;
                if(isFrontCam) x = 1 - x; 

                pointer.x = (x * 2) - 1;
                pointer.y = -(indexFingerTip.y * 2) + 1;

                // Di chuyển cursorMesh tới vị trí ngón tay
                raycaster.setFromCamera(pointer, camera);
                const distance = 4; // Khoảng cách giả lập mặt phẳng
                raycaster.ray.at(distance, cursorMesh.position);

                checkCollisions();
            } else {
                // Đưa cursor ra ngoài màn hình nếu không thấy tay
                pointer.x = -2; pointer.y = -2;
                cursorMesh.position.set(0, 0, 100);
            }
        }

        // --- 5. HỆ THỐNG SPAWN NHÂN VẬT 3D ---
        function createCharacter() {
            // Tạo nhân vật dễ thương (khối có tai)
            const group = new THREE.Group();
            
            const color = Math.random() * 0xffffff;
            const bodyGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const bodyMat = new THREE.MeshLambertMaterial({ color: color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            group.add(body);

            // Giả lập mặt đất: Xuất hiện ngẫu nhiên trong khoảng X, Y cố định dưới camera
            group.position.x = (Math.random() - 0.5) * 6;
            group.position.y = (Math.random() - 0.5) * 4;
            group.position.z = -2 + (Math.random() * -3); // Sâu vào trong
            
            // Xoay nhẹ cho sinh động
            group.rotation.x = Math.random() * Math.PI;
            group.rotation.y = Math.random() * Math.PI;

            // Thêm userData để nhận diện
            group.userData = { isEnemy: true, velocity: new THREE.Vector3((Math.random()-0.5)*0.02, (Math.random()-0.5)*0.02, 0) };

            scene.add(group);
            enemies.push(group);
        }

        function spawnLoop() {
            setInterval(() => {
                if (enemies.length < MAX_ENEMIES) {
                    createCharacter();
                }
            }, 800); // Mỗi 0.8s sinh 1 con
        }

        // --- 6. TƯƠNG TÁC VÀ HIỆU ỨNG PHÁT NỔ ---
        function checkCollisions() {
            raycaster.setFromCamera(pointer, camera);
            
            // Lấy danh sách các lưới (mesh) bên trong các group nhân vật
            const meshes = enemies.map(e => e.children[0]);
            const intersects = raycaster.intersectObjects(meshes);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                const hitGroup = hitMesh.parent;
                
                // Kích hoạt nổ
                createExplosion(hitGroup.position, hitMesh.material.color);
                
                // Xóa nhân vật
                scene.remove(hitGroup);
                const index = enemies.indexOf(hitGroup);
                if (index > -1) enemies.splice(index, 1);
                
                // Cộng điểm
                score++;
                scoreEl.innerText = score;
            }
        }

        function createExplosion(position, color) {
            const particleCount = 30;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const velocities = [];

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = position.x;
                positions[i * 3 + 1] = position.y;
                positions[i * 3 + 2] = position.z;

                velocities.push(
                    (Math.random() - 0.5) * 0.2,
                    (Math.random() - 0.5) * 0.2,
                    (Math.random() - 0.5) * 0.2
                );
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: color, size: 0.1 });
            const particleSystem = new THREE.Points(geo, mat);
            
            particleSystem.userData = { velocities: velocities, age: 0 };
            scene.add(particleSystem);
            particles.push(particleSystem);
        }

        // --- 7. VÒNG LẶP RENDER ---
        function animate() {
            requestAnimationFrame(animate);

            // Xoay nhẹ các nhân vật
            enemies.forEach(enemy => {
                enemy.rotation.x += 0.01;
                enemy.rotation.y += 0.01;
                enemy.position.add(enemy.userData.velocity);
            });

            // Cập nhật hiệu ứng nổ
            for (let i = particles.length - 1; i >= 0; i--) {
                let pSystem = particles[i];
                let positions = pSystem.geometry.attributes.position.array;
                
                for (let j = 0; j < positions.length / 3; j++) {
                    positions[j * 3] += pSystem.userData.velocities[j * 3];
                    positions[j * 3 + 1] += pSystem.userData.velocities[j * 3 + 1];
                    positions[j * 3 + 2] += pSystem.userData.velocities[j * 3 + 2];
                }
                pSystem.geometry.attributes.position.needsUpdate = true;
                
                // Làm mờ và xóa khi quá "già"
                pSystem.userData.age += 1;
                if (pSystem.userData.age > 30) {
                    scene.remove(pSystem);
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- KHỞI ĐỘNG ---
        initThreeJS();
        startCamera().then(() => {
            cameraUtils.start();
        });
    </script>
</body>
</html>
